[project]
name = "bi-copilot"
version = "1.0.0"
description = "Agentic BI copilot: governed SQL + cited RAG over a sales warehouse."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B905: zip(strict=) adds noise for same-length iterables built one line earlier.
# B017: the read-only test intentionally accepts any driver-level write error.
ignore = ["E501", "B905", "B017"]
